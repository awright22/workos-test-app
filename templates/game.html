<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <title>Mario-style Game</title>
    <style>
        #game-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .game-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body class="height-100vh">
    <div class="flex flex_column height-80vh">
        <div class="flex height-40vh">
            <div class="card">
                <h2 class="game-title">Mario {{ first_name }} {{ last_name }}</h2>
                <div id="game-container"></div>
                <a href="/" class="button button-outline back-link">Back to Dashboard</a>
            </div>
        </div>
    </div>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 400,
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;
        let platforms;
        let gameStarted = false;

        function preload() {
            // Load game assets
            this.load.setBaseURL('https://labs.phaser.io');
            this.load.image('ground', 'assets/sprites/platform.png');
            this.load.spritesheet('dude', 'assets/sprites/dude.png', { 
                frameWidth: 32, 
                frameHeight: 48 
            });
        }

        function create() {
            // Add platforms
            platforms = this.physics.add.staticGroup();
            platforms.create(400, 380, 'ground').setScale(2).refreshBody();
            platforms.create(600, 250, 'ground');
            platforms.create(50, 250, 'ground');
            platforms.create(750, 150, 'ground');

            // Add player
            player = this.physics.add.sprite(100, 300, 'dude');
            player.setBounce(0.2);
            player.setCollideWorldBounds(true);

            // Player animations
            this.anims.create({
                key: 'left',
                frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
                frameRate: 10,
                repeat: -1
            });

            this.anims.create({
                key: 'turn',
                frames: [{ key: 'dude', frame: 4 }],
                frameRate: 20
            });

            this.anims.create({
                key: 'right',
                frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
                frameRate: 10,
                repeat: -1
            });

            // Add collider
            this.physics.add.collider(player, platforms);

            // Input
            cursors = this.input.keyboard.createCursorKeys();

            // Add title text
            const playerName = "{{ first_name }} {{ last_name }}";
            this.add.text(400, 100, 'Press any arrow key to start', {
                fontSize: '20px',
                fill: '#000',
                align: 'center'
            }).setOrigin(0.5);
        }

        function update() {
            if (!gameStarted) {
                if (cursors.left.isDown || cursors.right.isDown || cursors.up.isDown) {
                    gameStarted = true;
                }
                return;
            }

            if (cursors.left.isDown) {
                player.setVelocityX(-160);
                player.anims.play('left', true);
            } else if (cursors.right.isDown) {
                player.setVelocityX(160);
                player.anims.play('right', true);
            } else {
                player.setVelocityX(0);
                player.anims.play('turn');
            }

            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-330);
            }
        }
    </script>
</body>
</html>
